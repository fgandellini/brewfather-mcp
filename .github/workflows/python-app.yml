# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      run: uv python install
    - name: Set up Node (pywrangler needs Node 22)
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install the project
      run: uv sync --locked --all-extras --dev
    - name: Run tests
      run: uv run pytest
    - name: Check the Worker bundle
      run: uv run pywrangler deploy --dry-run

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://brewfather-mcp.fgandellini.workers.dev

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      run: uv python install
    - name: Set up Node (pywrangler needs Node 22)
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install the project
      run: uv sync --locked --dev
    - name: Deploy to Cloudflare
      run: uv run pywrangler deploy
    - name: Smoke check (the Worker is up and refuses requests without a token)
      run: |
        for attempt in 1 2 3 4 5; do
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/mcp" \
            -H 'Content-Type: application/json' -d '{}')
          if [ "$code" = "401" ]; then
            echo "Worker answered 401 as expected"
            exit 0
          fi
          sleep 5
        done
        echo "Expected 401 from $WORKER_URL/mcp, got $code"
        exit 1
